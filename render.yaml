services:
  - type: web
    name: riit-bharat-mentors
    region: virginia
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_PROVIDER
        value: supabase
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SUPABASE_URL
        value: https://utgoqcobfqmfpnbcsvbf.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
